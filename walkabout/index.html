<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walkabout</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- Sliding text background strips -->
  <div class="btext" aria-hidden="true">
    <div class="btext-row btext-row--l"><div class="btext-track"><div class="btext-half"></div><div class="btext-half"></div></div></div>
    <div class="btext-row btext-row--r"><div class="btext-track"><div class="btext-half"></div><div class="btext-half"></div></div></div>
    <div class="btext-row btext-row--l"><div class="btext-track"><div class="btext-half"></div><div class="btext-half"></div></div></div>
    <div class="btext-row btext-row--r"><div class="btext-track"><div class="btext-half"></div><div class="btext-half"></div></div></div>
    <div class="btext-row btext-row--l"><div class="btext-track"><div class="btext-half"></div><div class="btext-half"></div></div></div>
    <div class="btext-row btext-row--r"><div class="btext-track"><div class="btext-half"></div><div class="btext-half"></div></div></div>
  </div>

  <!-- Black overlay fades in when the card opens -->
  <div id="bgOverlay" class="bg-overlay" aria-hidden="true"></div>

  <!-- Envelope -->
  <button id="envelope" class="envelope" type="button" aria-label="Open the card">
    <span class="env-inner">
      <span class="env-body"></span>
      <span class="env-flap"></span>
    </span>
    <span class="env-hint">open me</span>
  </button>

  <!-- Desktop view (md+): the two cards as a static landscape spread -->
  <div id="desktopView" class="hidden md:contents">
    <div class="card card--1" aria-hidden="true">
      <img src="../media/page3.jpeg" alt="Walkabout card one" draggable="false">
    </div>
    <div class="card card--2" aria-hidden="true">
      <img src="../media/page4.jpeg" alt="Walkabout card two" draggable="false">
    </div>
  </div>

  <!-- Mobile view (<md): the two cards as a swipe deck -->
  <div id="mobileView" class="fixed inset-0 md:hidden">
    <div id="pager" class="pager locked" aria-label="Walkabout pages">
      <div class="card card--1" aria-hidden="true">
        <img src="../media/page3.jpeg" alt="Walkabout card one" draggable="false">
      </div>
      <div class="card card--2" aria-hidden="true">
        <img src="../media/page4.jpeg" alt="Walkabout card two" draggable="false">
      </div>
    </div>
  </div>

  <!-- Music toggle (visible only after open) -->
  <button id="musicToggle" class="music-toggle" type="button" aria-label="Toggle music" hidden>
    <span class="glyph glyph-on">&#9835;</span>
    <span class="glyph glyph-off">&#9834;</span>
  </button>

  <audio id="bgAudio" src="../media/audio2.mp3" loop preload="auto"></audio>

  <script src="../script.js"></script>
</body>
</html>
